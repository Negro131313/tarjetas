<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика русского языка</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background:#eef3f7;
    margin:0;
}

h1{
    margin-top:20px;
}

#info{
    margin:10px;
    font-size:18px;
}

.grid{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:20px auto;
}

.card{
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    width:300px;
    text-align:center;
}

.card img{
    width:250px;
    height:250px;
    object-fit:contain;
}

input{
    width:220px;
    padding:8px;
    font-size:20px;
    text-align:center;
    margin-top:10px;
}

.correcto{
    background:#c8ffc8;
}

.incorrecto{
    background:#ffc8c8;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}
</style>

</head>
<body>

<h1>Напишите слово по-русски</h1>

<div id="info">Загрузка...</div>

<div class="grid" id="grid"></div>

<button onclick="skip()">Пропустить</button>

<script>

const carpeta = "cards/";
let imagenes = [];
let actuales = [];
let usadas = new Set();

// Normalizar texto
function normalizar(texto){
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

// Cargar JSON
fetch("imagenes.json")
.then(r => r.json())
.then(data=>{
    imagenes = data;
    siguienteRonda();
});

// Nueva ronda
function siguienteRonda(){

    if(usadas.size === imagenes.length){
        document.getElementById("info").innerText = "Вы закончили все карточки!";
        return;
    }

    const disponibles = imagenes.filter(i=>!usadas.has(i));

    actuales = [...disponibles]
        .sort(()=>Math.random()-0.5)
        .slice(0,1);

    actuales.forEach(i=>usadas.add(i));

    render();
}

// Mostrar tarjeta
function render(){

    const grid = document.getElementById("grid");
    grid.innerHTML="";

    document.getElementById("info").innerText =
        `Осталось: ${imagenes.length-usadas.size}`;

    actuales.forEach((img,index)=>{

        const nombre = img.replace(/\.[^.]+$/,"");

        const tarjeta = document.createElement("div");
        tarjeta.className = "card";

        tarjeta.innerHTML = `
            <img src="${carpeta}${img}">
            <br>
            <input 
                id="inp${index}" 
                type="text"
                autocomplete="off"
                placeholder="Введите слово"
            >
        `;

        grid.appendChild(tarjeta);

        document.getElementById("inp"+index)
        .addEventListener("input",function(){
            verificar(index,nombre);
        });

    });
}


// Saltar palabra
function skip(){

    actuales.forEach((img,index)=>{

        const nombre = img.replace(/\.[^.]+$/,"");
        const input = document.getElementById("inp"+index);

        input.value = nombre;
        input.classList.add("incorrecto");
        input.disabled = true;
    });

    setTimeout(()=>{
        siguienteRonda();
    },1900);
}

</script>

</body>
</html>
